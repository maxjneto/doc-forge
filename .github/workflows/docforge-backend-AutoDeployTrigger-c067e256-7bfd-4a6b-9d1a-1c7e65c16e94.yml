name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: docforgeregistry.azurecr.io
          username: ${{ secrets.DOCFORGEBACKEND_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCFORGEBACKEND_REGISTRY_PASSWORD }}

      - name: Build and Push
        run: |
          docker build \
            -t docforgeregistry.azurecr.io/docforge-backend:${{ github.sha }} \
            -t docforgeregistry.azurecr.io/docforge-backend:latest \
            packages/backend
          docker push docforgeregistry.azurecr.io/docforge-backend --all-tags

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DOCFORGEBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DOCFORGEBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DOCFORGEBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name docforge-backend \
            --resource-group rg-docforge \
            --image docforgeregistry.azurecr.io/docforge-backend:${{ github.sha }}


