name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'packages/backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: packages/backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: packages/backend
        run: ruff check .

      - name: Migrate
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/docforge_test
        run: alembic upgrade head

      - name: Test
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/docforge_test
        run: python -m pytest tests/ -v --ignore=tests/test_auth.py --ignore=tests/test_documents.py

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: docforgeregistry2.azurecr.io
          username: ${{ secrets.DOCFORGEBACKEND_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCFORGEBACKEND_REGISTRY_PASSWORD }}

      - name: Build
        run: |
          docker build \
            -t docforgeregistry2.azurecr.io/docforge-backend:${{ github.sha }} \
            -t docforgeregistry2.azurecr.io/docforge-backend:latest \
            packages/backend

      - name: Push and Deploy
        if: github.event_name != 'pull_request'
        run: |
          docker push docforgeregistry2.azurecr.io/docforge-backend --all-tags

      - name: Login to Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DOCFORGEBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DOCFORGEBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DOCFORGEBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        if: github.event_name != 'pull_request'
        run: |
          az containerapp update \
            --name docforge-backend \
            --resource-group rg-docforge \
            --image docforgeregistry2.azurecr.io/docforge-backend:${{ github.sha }}
