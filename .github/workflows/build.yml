name: Build & push images (GHCR)

# Builds the three app images on GitHub's runners (not on the VPS) and pushes
# them to the GitHub Container Registry. The 1-core VPS then only *pulls* these
# images — it never compiles anything (the Vite build in particular would be
# slow/OOM-prone on a small box).
#
# Images published:
#   ghcr.io/<owner>/doc-forge-backend
#   ghcr.io/<owner>/doc-forge-frontend
#   ghcr.io/<owner>/doc-forge-mcp
#
# Set these as repo *secrets* so the frontend bundle is built with the right
# keys (they are baked at build time — VITE_* are inlined by Vite):
#   VITE_CLERK_PUBLISHABLE_KEY   (publishable / public key — required)
#   VITE_POSTHOG_KEY             (optional)
# And optionally this repo *variable*:
#   VITE_POSTHOG_HOST            (defaults to https://us.i.posthog.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: packages/backend
          - service: frontend
            context: packages/frontend
          - service: mcp
            context: packages/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doc-forge-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/doc-forge-${{ matrix.service }}:${{ github.sha }}
          # VITE_* are only consumed by the frontend Dockerfile; the backend/mcp
          # builds ignore them (harmless "unused build-arg" warning).
          build-args: |
            VITE_API_BASE=/api
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
