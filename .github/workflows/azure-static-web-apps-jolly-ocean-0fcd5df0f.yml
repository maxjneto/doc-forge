name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create frontend .env
        working-directory: packages/frontend
        run: |
          echo "VITE_API_BASE=${{ secrets.VITE_API_BASE }}" >> .env
          echo "VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" >> .env

      - name: Install
        working-directory: packages/frontend
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional

      - name: Type check
        working-directory: packages/frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: packages/frontend
        run: npm run test:frontend -- --run

      - name: Build
        working-directory: packages/frontend
        run: npm run build

      - name: Deploy
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_OCEAN_0FCD5DF0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "packages/frontend/dist"
          output_location: ""
          skip_app_build: true
