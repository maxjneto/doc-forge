name: Deploy (VPS)

# Deploys by SSHing into the VPS and pulling the freshly built images from GHCR.
# Runs automatically after "Build & push images (GHCR)" succeeds on main, so the
# images always exist before the VPS pulls them. The VPS never builds anything.
#
# Configure these repo secrets to enable it (the deploy step self-skips when
# VPS_HOST is empty, so forks and unconfigured repos stay green):
#   VPS_HOST     - server hostname or IP
#   VPS_USER     - SSH user
#   VPS_SSH_KEY  - private key with access to the server
#   VPS_PATH     - checkout dir on the server (optional, default /opt/docforge)
#
# The VPS must be able to pull from GHCR. If the packages are private, run
# `docker login ghcr.io` once on the box (it persists in ~/.docker/config.json);
# if they are public, no login is needed.

on:
  workflow_run:
    workflows: ["Build & push images (GHCR)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # On workflow_run, only deploy if the build actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Deploy over SSH
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_PATH || '/opt/docforge' }}"
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Skipped (no VPS secrets configured)
        if: ${{ env.VPS_HOST == '' }}
        run: echo "VPS_HOST secret not set — skipping deploy. See deploy/README.md."
