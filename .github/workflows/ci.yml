name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: packages/backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: packages/backend
        run: ruff check .
      - name: Test
        working-directory: packages/backend
        run: pytest tests -q
      - name: Migrate (schema smoke test)
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/docforge_test
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: packages/frontend
        run: npm install --include=optional
      - name: Type check
        working-directory: packages/frontend
        run: npx tsc --noEmit
      - name: Test
        working-directory: packages/frontend
        run: npm run test
      - name: Build
        working-directory: packages/frontend
        env:
          VITE_API_BASE: /api
        run: npm run build

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: packages/mcp
        run: pip install -e . ruff
      - name: Lint
        working-directory: packages/mcp
        run: ruff check src/
