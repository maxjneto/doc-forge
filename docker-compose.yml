services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docforge
    ports:
      - "5480:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://backend:8000/api/inngest --no-discovery
    ports:
      - "8288:8288"
    environment:
      INNGEST_LOG_LEVEL: info
    healthcheck:
      # The inngest/inngest image has no curl/wget; use bash's /dev/tcp instead.
      test: ["CMD", "bash", "-c", "echo -n '' > /dev/tcp/localhost/8288"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./packages/backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inngest:
        condition: service_healthy
    env_file:
      - ./packages/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/docforge
      REDIS_URL: redis://redis:6379/0
      INNGEST_DEV_SERVER_URL: http://inngest:8288
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./packages/frontend
      target: dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    env_file:
      - ./packages/frontend/.env
    environment:
      VITE_API_BASE: http://localhost:8000/api

  mcp:
    build:
      context: ./packages/mcp
    ports:
      - "8001:8001"
    depends_on:
      - backend
    environment:
      DOCFORGE_API_BASE: http://backend:8000/api
      DOCFORGE_FRONTEND_BASE: http://localhost:5173
      PORT: "8001"
    # DOCFORGE_API_KEY is not set here — each agent authenticates via X-API-Key header

volumes:
  pgdata:
