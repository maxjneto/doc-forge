services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docforge
    ports:
      - "5480:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://backend:8000/api/inngest --no-discovery
    ports:
      - "8288:8288"
    environment:
      INNGEST_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8288/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./packages/backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      inngest:
        condition: service_healthy
    env_file:
      - ./packages/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/docforge
      INNGEST_DEV_SERVER_URL: http://inngest:8288
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./packages/frontend
      target: dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE: http://localhost:8000/api
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}

volumes:
  pgdata:
