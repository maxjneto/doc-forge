services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docforge
    ports:
      - "5480:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      # The first start runs initdb, which can take longer than the retries allow.
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./packages/backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      layout:
        condition: service_healthy
    env_file:
      - ./packages/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/docforge
      REDIS_URL: redis://redis:6379/0
      LAYOUT_SERVICE_URL: http://layout:8002
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Runs @docforge-lib/layout for the backend (validate, apply ops, map).
  layout:
    build:
      context: ./packages/layout-service
    ports:
      - "8002:8002"

  frontend:
    build:
      context: ./packages/frontend
      target: dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    env_file:
      - ./packages/frontend/.env
    environment:
      VITE_API_BASE: http://localhost:8000/api
      # Setup snippets in the app point agents at the local MCP server.
      VITE_MCP_URL: http://localhost:8001/mcp

  mcp:
    build:
      context: ./packages/mcp
    ports:
      - "8001:8001"
    depends_on:
      - backend
    environment:
      DOCFORGE_API_BASE: http://backend:8000/api
      DOCFORGE_FRONTEND_BASE: http://localhost:5173
      PORT: "8001"
    # DOCFORGE_API_KEY is not set here — each agent authenticates via X-API-Key header

volumes:
  pgdata:
