# DocForge — production stack for a single VPS (replaces Azure Container Apps).
#
#   cp deploy/.env.prod.example .env
#   # edit .env (domain, secrets, keys, IMAGE_OWNER)
#   docker login ghcr.io            # once, if the packages are private
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# The three app images (backend/frontend/mcp) are built by
# .github/workflows/build.yml and pulled from GHCR — the VPS never builds.
#
# Caddy terminates TLS (automatic Let's Encrypt) and routes:
#   https://$DOCFORGE_DOMAIN/api/*  -> backend:8000   (API + SSE + inngest)
#   https://$DOCFORGE_DOMAIN/*      -> frontend:80     (static SPA)
#   https://$DOCFORGE_MCP_DOMAIN/*  -> mcp:8001        (MCP streamable HTTP)
#
# Only Caddy publishes ports (80/443). Everything else talks over the internal
# network, so Postgres/Redis are never exposed to the internet.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOCFORGE_DOMAIN: ${DOCFORGE_DOMAIN}
      DOCFORGE_MCP_DOMAIN: ${DOCFORGE_MCP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - mcp

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-docforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  inngest:
    # Single-node Inngest for the hosted guided executor. Durable across
    # restarts via the sqlite volume. For HA/multi-node, move to Inngest Cloud
    # (the INNGEST_EVENT_KEY / INNGEST_SIGNING_KEY below are already plumbed).
    image: inngest/inngest:latest
    restart: unless-stopped
    command: inngest start
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?set INNGEST_EVENT_KEY in .env}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?set INNGEST_SIGNING_KEY in .env}
      INNGEST_SQLITE_DIR: /data
      INNGEST_LOG_LEVEL: info
    volumes:
      - inngestdata:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -n '' > /dev/tcp/localhost/8288"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/${IMAGE_OWNER:-maxjneto}/doc-forge-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inngest:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-docforge}
      REDIS_URL: redis://redis:6379/0
      INNGEST_DEV_SERVER_URL: http://inngest:8288
      IS_PRODUCTION: "true"
      CORS_ORIGINS: '["https://${DOCFORGE_DOMAIN}"]'
      CLERK_AUTHORIZED_PARTIES: '["https://${DOCFORGE_DOMAIN}"]'
      STRIPE_PORTAL_RETURN_URL: https://${DOCFORGE_DOMAIN}/billing
      STRIPE_CHECKOUT_SUCCESS_URL: https://${DOCFORGE_DOMAIN}/billing?checkout=success
      STRIPE_CHECKOUT_CANCEL_URL: https://${DOCFORGE_DOMAIN}/billing?checkout=cancel
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  mcp:
    image: ghcr.io/${IMAGE_OWNER:-maxjneto}/doc-forge-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOCFORGE_API_BASE: http://backend:8000/api
      DOCFORGE_FRONTEND_BASE: https://${DOCFORGE_DOMAIN}
      HOST: 0.0.0.0
      PORT: "8001"

  frontend:
    # VITE_* are baked into this image at build time by the GHCR workflow.
    image: ghcr.io/${IMAGE_OWNER:-maxjneto}/doc-forge-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  inngestdata:
  caddy_data:
  caddy_config:
