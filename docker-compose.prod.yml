# DocForge — production stack for a single VPS.
#
#   cp deploy/.env.prod.example .env
#   # edit .env (domain, secrets, keys, IMAGE_OWNER)
#   docker login ghcr.io            # once, if the packages are private
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# The four app images (backend/frontend/mcp/layout) are built by
# .github/workflows/build.yml and pulled from GHCR — the VPS never builds.
#
# Caddy terminates TLS (automatic Let's Encrypt) and routes:
#   https://$DOCFORGE_DOMAIN/api/*  -> backend:8000   (API + SSE)
#   https://$DOCFORGE_DOMAIN/*      -> frontend:80     (static SPA)
#   https://$DOCFORGE_MCP_DOMAIN/*  -> mcp:8001        (MCP streamable HTTP)
#
# Only Caddy publishes ports (80/443). Everything else talks over the internal
# network, so Postgres is never exposed to the internet. The layout service has
# no Caddy route at all: only the backend calls it.
#
# Single-VPS profile: SSE uses in-process queues (single backend replica), so
# there is no Redis here. Re-add Redis + set REDIS_URL only if you scale the
# backend to multiple replicas.
#
# Every app container has a healthcheck, so `docker compose ps` (and the deploy
# workflow, which waits for them) tells a running stack from a healthy one.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOCFORGE_DOMAIN: ${DOCFORGE_DOMAIN}
      DOCFORGE_MCP_DOMAIN: ${DOCFORGE_MCP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - mcp

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-docforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
      # The first start runs initdb, which can take longer than the retries allow.
      start_period: 30s

  backend:
    image: ghcr.io/${IMAGE_OWNER:-maxjneto}/doc-forge-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      layout:
        condition: service_healthy
    env_file:
      - .env
    environment:
      LAYOUT_SERVICE_URL: http://layout:8002
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-docforge}
      # No REDIS_URL → SSE uses in-process queues (single replica).
      IS_PRODUCTION: "true"
      CORS_ORIGINS: '["https://${DOCFORGE_DOMAIN}"]'
      CLERK_AUTHORIZED_PARTIES: '["https://${DOCFORGE_DOMAIN}"]'
      STRIPE_PORTAL_RETURN_URL: https://${DOCFORGE_DOMAIN}/billing
      STRIPE_CHECKOUT_SUCCESS_URL: https://${DOCFORGE_DOMAIN}/billing?checkout=success
      STRIPE_CHECKOUT_CANCEL_URL: https://${DOCFORGE_DOMAIN}/billing?checkout=cancel
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Runs @docforge-lib/layout for the backend. Stateless, internal only.
  layout:
    image: ghcr.io/${IMAGE_OWNER:-maxjneto}/doc-forge-layout:${IMAGE_TAG:-latest}
    restart: unless-stopped

  mcp:
    image: ghcr.io/${IMAGE_OWNER:-maxjneto}/doc-forge-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOCFORGE_API_BASE: http://backend:8000/api
      DOCFORGE_FRONTEND_BASE: https://${DOCFORGE_DOMAIN}
      HOST: 0.0.0.0
      PORT: "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    # VITE_* are baked into this image at build time by the GHCR workflow.
    image: ghcr.io/${IMAGE_OWNER:-maxjneto}/doc-forge-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
