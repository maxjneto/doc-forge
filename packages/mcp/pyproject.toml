[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docforge-mcp"
version = "0.1.0"
description = "MCP server for DocForge — lets AI agents read and write to shared live documents"
requires-python = ">=3.11"
dependencies = [
    # This server uses the v1 FastMCP API (`mcp.server.fastmcp`). MCP v2
    # removed that import path, so keep the upper bound explicit.
    "mcp>=1.27,<2",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docforge-mcp-server = "docforge_mcp.server:serve"  # Streamable HTTP

[tool.hatch.build.targets.wheel]
packages = ["src/docforge_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/docforge_mcp/resources" = "docforge_mcp/resources"
