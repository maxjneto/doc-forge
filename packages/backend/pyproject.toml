[project]
name = "docforge-backend"
version = "0.1.0"
description = "DocForge - AI-powered RFC orchestrator backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "inngest>=0.4.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "greenlet>=3.0.0",
    "loguru>=0.7.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "posthog>=7.16.2",
    "redis>=5.0.0",
    "stripe>=11.0.0",
    # Document export (Markdown -> PDF/DOCX), all pure-Python (no system libs):
    "markdown>=3.6",
    "xhtml2pdf>=0.2.16",
    "htmldocx>=0.0.6",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
